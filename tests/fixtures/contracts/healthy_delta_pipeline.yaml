pipeline:
  name: healthy_delta
  environment: production
  owner: data-engineering
source:
  type: delta
  format: delta
  path: abfss://landing@acct.dfs.core.windows.net/healthy_delta/
  expected_daily_volume_gb: 400
  peak_daily_volume_gb: 900
  growth_rate_percent: 5
  partitioning: [event_date]
  compression: snappy
processing:
  type: incremental
  language: pyspark
target:
  type: delta
  catalog: prod
  schema: marts
  path: abfss://curated@acct.dfs.core.windows.net/healthy_delta/
  format: delta
sla:
  max_runtime_minutes: 60
schedule:
  frequency: daily
  time: "02:00"
reliability:
  retry_count: 2
  idempotent: true
scalability:
  forecast_horizon_days: 180
cluster:
  num_workers: 6
  spark_version: "15.4.x-scala2.12"
  node_type: Standard_D8ds_v5
job:
  max_retries: 2
  timeout_seconds: 3600
code_path: ../code/good_pipeline.py
