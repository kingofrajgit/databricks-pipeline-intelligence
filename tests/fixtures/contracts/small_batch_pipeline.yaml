pipeline:
  name: small_batch
  environment: development
  owner: data-engineering
source:
  type: adls
  format: parquet
  path: abfss://landing@acct.dfs.core.windows.net/small_batch/
  expected_daily_volume_gb: 10
  peak_daily_volume_gb: 25
  growth_rate_percent: 2
processing:
  type: incremental
  language: pyspark
target:
  type: delta
  catalog: dev
  schema: marts
  path: abfss://curated@acct.dfs.core.windows.net/small_batch/
  format: delta
sla:
  max_runtime_minutes: 30
schedule:
  frequency: daily
  time: "02:00"
reliability:
  retry_count: 2
  idempotent: true
scalability:
  forecast_horizon_days: 90
cluster:
  num_workers: 2
  spark_version: "15.4.x-scala2.12"
  node_type: Standard_D4ds_v5
job:
  max_retries: 2
  timeout_seconds: 1800
code_path: ../code/good_pipeline.py
