pipeline:
  name: csv_large_volume
  environment: production
  owner: data-engineering
source:
  type: adls
  format: csv
  path: abfss://landing@acct.dfs.core.windows.net/csv_large/
  expected_daily_volume_gb: 600
  peak_daily_volume_gb: 1200
  growth_rate_percent: 6
  compression: gzip
processing:
  type: incremental
  language: pyspark
target:
  type: delta
  catalog: prod
  schema: marts
  path: abfss://curated@acct.dfs.core.windows.net/csv_large/
  format: delta
sla:
  max_runtime_minutes: 90
schedule:
  frequency: daily
  time: "02:00"
reliability:
  retry_count: 2
  idempotent: true
scalability:
  forecast_horizon_days: 180
cluster:
  num_workers: 8
  spark_version: "15.4.x-scala2.12"
  node_type: Standard_D8ds_v5
job:
  max_retries: 2
  timeout_seconds: 5400
code_path: ../code/good_pipeline.py
