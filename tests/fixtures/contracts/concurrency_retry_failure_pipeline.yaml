pipeline:
  name: concurrency_retry_failure_pipeline
  environment: production
  owner: data-engineering
source:
  type: adls
  format: parquet
  path: abfss://landing@acct.dfs.core.windows.net/events_stream/
  expected_daily_volume_gb: 250
  peak_daily_volume_gb: 500
  growth_rate_percent: 10
processing:
  type: batch
  language: pyspark
target:
  type: delta
  catalog: prod
  schema: raw
  path: abfss://curated@acct.dfs.core.windows.net/events_unprotected/
  format: delta
sla:
  max_runtime_minutes: 60
schedule:
  frequency: daily
  time: "01:00"
reliability:
  retry_count: 3
  idempotent: false
  retry_safety: false
scalability:
  forecast_horizon_days: 180
cluster:
  num_workers: 4
  spark_version: "15.4.x-scala2.12"
  node_type: Standard_D4ds_v5
job:
  max_retries: 3
  max_concurrent_runs: 4
  timeout_seconds: 3600
code_path: ../code/concurrency_retry_failure_pipeline.py
