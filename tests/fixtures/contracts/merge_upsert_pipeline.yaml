  num_workers: 4
  spark_version: "15.4.x-scala2.12"
  node_type: Standard_D4ds_v5
job:
  max_retries: 2
  max_concurrent_runs: 1
  timeout_seconds: 2700
code_path: ../code/merge_upsert_pipeline.py
