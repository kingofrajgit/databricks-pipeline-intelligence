rule_id: CODE-SQL-005

name: Global ORDER BY Risk

category: code

severity: HIGH

description: >
  Detect global ORDER BY on large inputs. Global sorting forces a wide
  shuffle and single-partition output, which can be a performance bottleneck.

condition: >
  ORDER BY present AND input volume >= sort_gb

evaluator: global_sort

params:
  sort_gb: 100.0

evidence_required:
  - file
  - line
  - order_by
  - input_gb

recommendation: >
  Global sort on large input forces wide shuffle; prefer partitioned
  ordering where possible, or avoid global sort if not strictly necessary.

blocking: false

score: 7.0

version: 1.0.0

context_aware: true

requires_context:
  - data_size_gb