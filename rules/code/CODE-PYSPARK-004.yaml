rule_id: CODE-PYSPARK-004

name: CrossJoin Detection

category: code

severity: MEDIUM

description: >
  Detect crossJoin operations which can produce cartesian products.

condition: >-
  \bcrossJoin\b

evidence_required:
  - code_location

recommendation: >
  Replace crossJoin with explicit join key if possible, or ensure small right-side dataset.

blocking: false

score: 3.0

version: 1.0.0

context_aware: true

requires_context:
  - data_size_gb
